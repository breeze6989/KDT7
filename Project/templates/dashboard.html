<!doctype html><html lang="ko">
<head>
<meta charset="utf-8">
<title>화재 감지 대시보드</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header class="header">
  <h1>화재 감지 대시보드</h1>
  <div class="header-right">

    <!-- ▽ 배열 버튼 -->
    <div class="layout-box">
      <button id="layoutBtn" class="layout-btn">배열 4 × 3</button>
      <ul id="layoutMenu" class="layout-menu">
        <li data-layout="2x2">2 × 2</li>
        <li data-layout="4x3">4 × 3</li>
        <li data-layout="5x3">5 × 3</li>
        <li data-layout="5x4">5 × 4</li>
      </ul>
    </div>

    <!-- ▽ 영상 교체 모드 -->
    <button id="swapModeBtn" class="layout-btn">영상 교체 모드</button>

    <a href="{{ url_for('show_logs') }}" class="layout-btn">상황 로그 페이지</a>
    <a href="{{ url_for('logout')     }}" class="layout-btn">로그아웃</a>
  </div>
</header>


<div style="display:flex;height:calc(100vh - 60px)">

  <!-- ▽ 사이드바 -->
  <aside class="sidebar">
    <h2>상황 로그</h2>
    <ul id="sidebarLogUl" class="sidebar-log"></ul>
    <a href="{{ url_for('show_logs') }}" class="all-log-link">전체 보기</a>

    <hr style="border:0;border-top:1px solid #314057;margin:18px 0">
    <h2 style="margin-bottom:8px">사건 신고 현황</h2>
    <ul style="padding-left:0;font-size:14px;line-height:1.4">
      <li>[2025-07-29 09:00] #2 구역 소각 신고 (마포구)</li>
      <li>[2025-07-29 08:30] #6 구역 영농폐기물 소각 신고 (서초구)</li>
    </ul>
  </aside>

  <!-- ▽ 메인 그리드 -->
  <section class="dashboard-grid">
    <div class="grid-header">
      <div>총 CCTV <span id="totalCCTVs">0</span></div>
      <div>화재 <span id="fireCnt">0</span></div>
      <div>주의 <span id="warnCnt">0</span></div>
    </div>
    <div id="gridContainer" class="grid-container grid-container-4x3"></div>
  </section>
</div>

{% include 'modal_snippet.html' %}

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/modal.js')     }}"></script>
<script src="{{ url_for('static', filename='js/swap.js')      }}"></script>
</body></html>
