<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>화재 감지 대시보드</title>

<!-- 스타일 -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

<!-- 전역 스크립트 (defer) -->
<script src="{{ url_for('static', filename='js/dashboard.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/modal.js') }}" defer></script>
</head>

<body>
<header class="header">
  <h1>화재 감지 대시보드</h1>
  <div class="header-right">
    <div class="layout-dropdown-container">
      <div id="layoutToggleButton" class="layout-toggle-button">배열 4 X 3</div>
      <div id="layoutDropdownMenu" class="dropdown-menu">
        <div class="dropdown-item" data-layout="4x3">4 X 3</div>
        <div class="dropdown-item" data-layout="5x3">5 X 3</div>
        <div class="dropdown-item" data-layout="5x4">5 X 4</div>
      </div>
    </div>
    <a href="{{ url_for('show_logs') }}" class="layout-toggle-button">상황 로그 페이지</a>
    <a href="{{ url_for('logout') }}" class="layout-toggle-button">로그아웃</a>
  </div>
</header>

<div style="display:flex;height:calc(100vh - 60px);">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>상황 로그</h2>
    <ul id="sidebarLogUl" class="sidebar-log"></ul>
    <a href="{{ url_for('show_logs') }}" class="all-log-link">전체 보기</a>
  </aside>

  <!-- Main -->
  <section class="dashboard-grid">
    <div class="grid-header">
      <div>총 CCTV <span id="totalCCTVs">0</span></div>
      <div>화재 <span id="fireDetections">0</span></div>
      <div>오탐률 <span id="falsePositives">0%</span></div>
    </div>
    <div id="gridContainer" class="grid-container grid-container-4x3"></div>
  </section>
</div>

<!-- Modal -->
<div id="cctvModal" class="modal">
  <div class="modal-content">
    <span class="close-button">×</span>
    <video id="modalVideo" autoplay muted></video>
    <div style="flex:1 1 45%;display:flex;flex-direction:column;">
      <div id="modalMap" style="flex:1 1 70%;border-radius:6px;"></div>
      <div id="modalInfo" style="flex:1 1 30%;padding-top:8px;"></div>
    </div>
    <button id="ackButton" class="ack-btn" style="display:none;">경보 해제</button>
  </div>
</div>
</body>
</html>
