<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화재 감지 대시 보드</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <h1>화재 감지 대시 보드</h1>
            </div>
            <div class="header-right">
                <a href="#" class="user-info">사용자 정보</a>
                <a href="{{ url_for('logout') }}" class="logout">로그아웃</a>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h2><a href="{{ url_for('show_all_logs') }}" class="log-link" style="text-decoration: none; color: black;">상황 로그</a></h2>
                    <ul id="recent-logs-list">
                        </ul>
                </div>
                <div class="sidebar-section">
                    <h2>사건 신고 현황</h2>
                    <ul>
                        <li>[2025-07-29 09:00] #2 구역 소각 신고 (마포구)</li>
                        <li>[2025-07-29 08:30] #6 구역 영농폐기물 소각 신고 (서초구)</li>
                    </ul>
                </div>
            </aside>

            <section class="dashboard-grid">
                <div class="grid-header">
                    <div>탐지 건수 <span id="totalCCTVs">0</span></div>
                    <div>화재 <span id="fireDetections">0</span></div>
                    <div>오탐률 <span id="falsePositives">0%</span></div>
                    <div>배열 4 X 3</div>
                </div>
                <div class="grid-container">
                    </div>
            </section>
        </main>
    </div>

    <div id="cctvModal" class="modal">
        <div class="modal-content">
            <span class="close-button">×</span>
            <div class="modal-left-panel">
                <h2 class="modal-cctv-title"><span id="modalCCTVName">CCTV 상세 정보</span></h2>
                <video id="modalCCTVVideo" controls muted autoplay style="width: 100%; height: auto;"></video>
                <div class="modal-cctv-details">
                    <p><strong>CCTV ID:</strong> <span id="detailCCTVId"></span></p>
                    <p><strong>상태:</strong> <span id="detailCCTVStatus"></span></p>
                    <p><strong>최근 이벤트:</strong> <span id="detailCCTVRecentEvent"></span></p>
                    </div>
            </div>
            <div class="modal-right-panel">
                <h2 class="modal-map-title">CCTV 위치 2D Map</h2>
                <div id="mapContainer" style="height: 300px; width: 100%;"></div>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" defer></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('cctvModal');
            const span = document.getElementsByClassName('close-button')[0];
            const modalCCTVVideo = document.getElementById('modalCCTVVideo');
            const modalCCTVName = document.getElementById('modalCCTVName'); // 추가
            const detailCCTVId = document.getElementById('detailCCTVId');
            const detailCCTVStatus = document.getElementById('detailCCTVStatus');
            const detailCCTVRecentEvent = document.getElementById('detailCCTVRecentEvent'); // 추가
            const mapContainer = document.getElementById('mapContainer');

            let mymap = null; // Leaflet 맵 인스턴스

            function loadHLSStream(videoElement, streamUrl) {
                if (!videoElement) {
                    console.error(`Video element not found.`);
                    return;
                }

                if (Hls.isSupported()) {
                    // 기존 HLS 인스턴스가 있다면 파괴
                    if (videoElement.hlsInstance) {
                        videoElement.hlsInstance.destroy();
                    }
                    const hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(videoElement);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        videoElement.play();
                    });
                    videoElement.hlsInstance = hls; // 인스턴스 저장
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = streamUrl;
                    videoElement.addEventListener('loadedmetadata', function() {
                        videoElement.play();
                    });
                } else {
                    console.warn('HLS is not supported in this browser.');
                }
            }

            // 백엔드 API로부터 데이터를 가져와 대시보드를 업데이트하는 함수
            function fetchDashboardData() {
                fetch('/api/dashboard_data')
                    .then(response => response.json())
                    .then(data => {
                        // 1. 상황 로그 업데이트
                        const logList = document.getElementById('recent-logs-list'); // ID로 변경
                        logList.innerHTML = ''; // 기존 로그 삭제
                        data.log_list.forEach(log => {
                            const li = document.createElement('li');
                            // 로그 페이지로 이동하는 링크 추가
                            // log.id를 사용하도록 수정
                            li.innerHTML = `<a href="{{ url_for('show_all_logs') }}?log_id=${log.id}" style="text-decoration: none; color: inherit;">
                                ${log.timestamp} ${log.message}
                            </a>`;
                            logList.appendChild(li);
                        });

                        // 2. CCTV 그리드 업데이트 (동적으로 생성)
                        const gridContainer = document.querySelector('.grid-container');
                        // 기존 그리드 아이템들을 제거하기 전에 현재 활성화된 HLS 스트림을 파괴
                        gridContainer.querySelectorAll('.cctv-video').forEach(video => {
                            if (video.hlsInstance) {
                                video.hlsInstance.destroy();
                                video.hlsInstance = null;
                            }
                            video.removeAttribute('src');
                            video.load(); // 영상 로드 중지
                        });
                        gridContainer.innerHTML = ''; // 기존 그리드 아이템 삭제

                        data.cctv_list.forEach(cctv => {
                            const gridItem = document.createElement('div');
                            gridItem.className = 'grid-item';
                            gridItem.dataset.cctvId = cctv.cctv_id;
                            gridItem.dataset.streamUrl = cctv.stream_url;
                            gridItem.dataset.status = cctv.status;
                            gridItem.dataset.latitude = cctv.location.latitude;
                            gridItem.dataset.longitude = cctv.location.longitude;
                            gridItem.dataset.name = cctv.name; // CCTV 이름 추가
                            gridItem.dataset.recentEvent = cctv.recent_event; // 최근 이벤트 추가


                            // 상태에 따른 클래스 추가
                            if (cctv.status === '화재감지') {
                                gridItem.classList.add('fire-detected');
                            } else if (cctv.status === '오탐') {
                                gridItem.classList.add('false-positive');
                            }

                            const videoId = `cctvVideo${cctv.cctv_id}`; // 고유 ID 생성
                            gridItem.innerHTML = `
                                <div class="cctv-header">
                                    <span class="cctv-id">#${cctv.cctv_id}</span>
                                    <span class="cctv-status ${cctv.status}">${cctv.status}</span>
                                </div>
                                <video id="${videoId}" class="cctv-video" autoplay muted playsinline></video>
                                <div class="cctv-info">${cctv.name}</div>
                            `;
                            gridContainer.appendChild(gridItem);

                            // HLS 스트림 로드
                            loadHLSStream(document.getElementById(videoId), cctv.stream_url);

                            // 클릭 이벤트 리스너 추가 (모달 열기)
                            gridItem.addEventListener('click', function() {
                                modal.style.display = 'block';
                                modalCCTVName.textContent = cctv.name; // CCTV 이름 표시
                                detailCCTVId.textContent = cctv.cctv_id;
                                detailCCTVStatus.textContent = cctv.status;
                                detailCCTVStatus.className = ''; // 기존 클래스 제거
                                detailCCTVStatus.classList.add(cctv.status); // 상태에 따른 클래스 추가
                                detailCCTVRecentEvent.textContent = cctv.recent_event; // 최근 이벤트 표시
                                
                                // 모달 영상 로드 (기존 영상 파괴 후 로드)
                                if (modalCCTVVideo.hlsInstance) {
                                    modalCCTVVideo.hlsInstance.destroy();
                                    modalCCTVVideo.hlsInstance = null;
                                }
                                loadHLSStream(modalCCTVVideo, cctv.stream_url); // ID가 'modalCCTVVideo'인 요소에 스트림 로드

                                // Leaflet 맵 초기화 및 마커 추가
                                if (mymap) {
                                    mymap.remove(); // 기존 맵 제거
                                }
                                mymap = L.map('mapContainer').setView([cctv.location.latitude, cctv.location.longitude], 13); // 'modalCCTVMap'을 'mapContainer'로 변경
                                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                                }).addTo(mymap);
                                L.marker([cctv.location.latitude, cctv.location.longitude]).addTo(mymap)
                                    .bindPopup(cctv.name).openPopup();
                                setTimeout(() => { // 맵 로딩 후 크기 재조정
                                    mymap.invalidateSize(); 
                                }, 100);
                            });
                        });

                        // 3. 통계 업데이트
                        document.getElementById('totalCCTVs').textContent = data.stats.total_cctvs;
                        document.getElementById('fireDetections').textContent = data.stats.fire_detections;
                        document.getElementById('falsePositives').textContent = `${data.stats.false_positives_rate}`;
                    })
                    .catch(error => {
                        console.error('Error fetching dashboard data:', error);
                        // 에러 발생 시 사용자에게 알림 또는 기본 데이터 표시
                    });
            }

            // 페이지 로드 시 대시보드 데이터 로드
            fetchDashboardData();
            // 5초마다 데이터 갱신 (선택 사항, 필요에 따라 조정)
            setInterval(fetchDashboardData, 5000); // 5초마다 데이터 새로고침

            // 모달 닫기 버튼
            span.onclick = function() {
                modal.style.display = 'none';
                if (mymap) {
                    mymap.remove(); // 모달 닫을 때 맵 인스턴스 정리
                    mymap = null;
                }
                if (modalCCTVVideo.hlsInstance) { // HLS 인스턴스 파괴
                    modalCCTVVideo.hlsInstance.destroy();
                    modalCCTVVideo.hlsInstance = null;
                }
                modalCCTVVideo.pause();
                modalCCTVVideo.removeAttribute('src'); // 영상 소스 제거
                modalCCTVVideo.load(); // 영상 로드 중지
            }

            // 모달 외부 클릭 시 닫기
            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                    if (mymap) {
                        mymap.remove();
                        mymap = null;
                    }
                    if (modalCCTVVideo.hlsInstance) {
                        modalCCTVVideo.hlsInstance.destroy();
                        modalCCTVVideo.hlsInstance = null;
                    }
                    modalCCTVVideo.pause();
                    modalCCTVVideo.removeAttribute('src');
                    modalCCTVVideo.load();
                }
            }
        });
    </script>
</body>
</html>
