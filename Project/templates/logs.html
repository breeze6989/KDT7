<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>상황 로그</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <!-- HLS 플레이어 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
</head>

<body class="dark">
  <header class="header">
    <div class="header-left"><h1>📜 상황 로그</h1></div>
    <div class="header-right">
      <a href="{{ url_for('dashboard') }}" class="layout-toggle-button">대시보드</a>
      <a href="{{ url_for('logout') }}" class="logout">로그아웃</a>
    </div>
  </header>

  <main class="main-content">
    <section class="dashboard-grid" style="width:100%;">
      <!-- ───────── 페이지 네비게이션 ───────── -->
      <div class="pagination my-3">
        {% for p in range(1, page_cnt + 1) %}
          {% if p == page %}
            <span class="page active">{{ p }}</span>
          {% else %}
            <a href="{{ url_for('show_logs', page=p) }}" class="page">{{ p }}</a>
          {% endif %}
        {% endfor %}
      </div>

      <!-- ───────── 로그 목록 (10개) ───────── -->
      <ul id="logList" class="log-ul">
        {% for l in logs %}
        <li class="log-item"
            data-stream="{{ l.src }}"
            data-lat="{{ l.lat }}"
            data-lng="{{ l.lng }}"
            data-msg="{{ l.msg }}">
          [{{ l.ts }}] {{ l.msg }}
        </li>
        {% endfor %}
      </ul>
    </section>
  </main>

  <!-- ───────── 모달(대시보드와 동일 구조) ───────── -->
  <div id="cctvModal" class="modal">
    <div class="modal-content">
      <span class="close-button">×</span>
      <video id="modalVideo" controls autoplay muted style="flex:1 1 65%;max-height:80vh;"></video>
      <div id="modalInfo" style="flex:1 1 35%;font-size:14px;padding:6px 12px;"></div>
    </div>
  </div>

  <!-- 공용 모달 스크립트 (대시보드와 공유) -->
  <script src="{{ url_for('static', filename='js/modal.js') }}"></script>

  <!-- 로그 페이지 전용 추가 스타일(선택) -->
  <style>
    .log-ul        { list-style:none;margin:0;padding:0; }
    .log-item      { cursor:pointer;padding:8px 6px;border-bottom:1px solid #314057;
                     color:#dee2e6; }
    .log-item:hover{ background:#243447; }
    .pagination    { text-align:center; }
    .page, .page.active{ display:inline-block;padding:4px 9px;margin:0 3px;
                         border:1px solid #6c757d;border-radius:3px;
                         font-size:14px; }
    .page          { color:#66d9ff;text-decoration:none; }
    .page.active   { background:#6c757d;color:#fff; }
  </style>
</body>
</html>
